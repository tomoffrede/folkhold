# Keeps the free Supabase project awake: once a day it calls the small ping() function.
# Free for public repositories. The key below is the public "publishable" key (the same one the app uses), not a secret.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        run: |
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            'https://prfdfmxflsdcihbigxtg.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_9qNEVzisapPnWzrrmIRpZQ_iwWgBkMk' \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"; cat response.txt; echo
          test "$code" = "200"
