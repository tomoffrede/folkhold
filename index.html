<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF5EC">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Folkhold</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folkhold">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" hidden>

<main class="content">

<section class="screen" data-screen="home" hidden>
<header class="home-header">
<div class="brand"><img class="brand-logo" src="icons/logo.svg" alt="" width="44" height="44"><h1 class="wordmark" data-text="app.name"></h1></div>
</header>

<div class="a2hs-card no-print" id="a2hs-card" hidden>
<p data-text="a2hs.card"></p>
<div class="a2hs-actions">
<button type="button" class="btn btn-primary btn-small" id="a2hs-show" data-text="a2hs.show"></button>
<button type="button" class="link link-small" id="a2hs-hide" data-text="a2hs.hide"></button>
</div>
</div>

<div class="home-actions">
<button type="button" class="btn btn-primary" data-action="add-contact">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M19 8v6M16 11h6"/></svg>
<span data-text="home.addContact"></span>
</button>
<div class="btn-row">
<button type="button" class="btn btn-secondary" data-action="add-event">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>
<span data-text="home.addEvent"></span>
</button>
<button type="button" class="btn btn-secondary" data-action="add-note">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
<span data-text="home.addNote"></span>
</button>
</div>
</div>

<div class="section-head">
<h2 class="section-title" data-text="home.upcomingTitle"></h2>
<span class="section-note" data-text="home.upcomingRange"></span>
</div>
<div id="home-upcoming"></div>
<p class="empty" id="home-upcoming-empty" data-text="home.upcomingEmpty" hidden></p>
</section>

<section class="screen" data-screen="contacts" hidden>
<div class="screen-head">
<h2 class="section-title" data-text="contacts.title"></h2>
<button type="button" class="btn btn-secondary btn-small" data-action="add-contact" data-text="contacts.add"></button>
</div>
<p class="empty" id="contacts-status" hidden></p>
<div class="search-line">
<div class="search-wrap">
<input type="search" class="search-box" id="contacts-search" data-placeholder="search.placeholder" autocomplete="off" spellcheck="false">
<button type="button" class="search-clear" id="search-clear" data-label="search.clear" hidden>×</button>
</div>
<button type="button" class="btn btn-secondary btn-small filter-button" id="filter-button" aria-expanded="false" data-text="filter.button"></button>
</div>
<div class="tag-filter" id="contacts-filter" hidden></div>
<ul class="people" id="contacts-list"></ul>
<div id="search-results" hidden></div>
<p class="empty" id="contacts-nomatch" data-text="contacts.noMatch" hidden></p>
<p class="empty" id="contacts-empty" data-text="contacts.empty" hidden></p>
</section>

<section class="screen" data-screen="contact" hidden>
<a class="link back" href="#/contacts" data-text="contact.back"></a>
<div id="contact-page"></div>
</section>

<section class="screen" data-screen="events" hidden>
<div id="events-page"></div>
</section>

<section class="screen" data-screen="note" hidden>
<div id="note-page"></div>
</section>

<section class="screen" data-screen="upcoming" hidden>
<h2 class="section-title" data-text="upcoming.title"></h2>
<div class="prio-row" id="upcoming-range"></div>
<div id="upcoming-list"></div>
<p class="empty" id="upcoming-empty" data-text="upcoming.empty" hidden></p>
</section>

<section class="screen" data-screen="settings" hidden>
<h2 class="section-title" data-text="settings.title"></h2>
<div class="account">
<p class="account-line"><span data-text="settings.signedInAs"></span> <strong id="settings-username"></strong></p>
<button type="button" class="btn btn-secondary btn-small" data-action="sign-out" data-text="settings.signOut"></button>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.sortTitle"></h3>
<div class="choice">
<label class="choice-option"><input type="radio" name="contact-sort" value="first" checked disabled><span data-text="settings.sortFirst"></span></label>
<label class="choice-option"><input type="radio" name="contact-sort" value="last" disabled><span data-text="settings.sortLast"></span></label>
</div>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.contactPageTitle"></h3>
<label class="check"><input type="checkbox" id="setting-lastmet" checked disabled><span data-text="settings.showLastMet"></span></label>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.fieldsTitle"></h3>
<p class="hint" data-text="settings.fieldsHint"></p>
<label class="check"><input type="checkbox" data-hide-field="emails" checked disabled><span data-text="settings.field.emails"></span></label>
<label class="check"><input type="checkbox" data-hide-field="phones" checked disabled><span data-text="settings.field.phones"></span></label>
<label class="check"><input type="checkbox" data-hide-field="addresses" checked disabled><span data-text="settings.field.addresses"></span></label>
<label class="check"><input type="checkbox" data-hide-field="handles" checked disabled><span data-text="settings.field.handles"></span></label>
<label class="check"><input type="checkbox" data-hide-field="birthday" checked disabled><span data-text="settings.field.birthday"></span></label>
<label class="check"><input type="checkbox" data-hide-field="met" checked disabled><span data-text="settings.field.met"></span></label>
<label class="check"><input type="checkbox" data-hide-field="relations" checked disabled><span data-text="settings.field.relations"></span></label>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.notesTitle"></h3>
<label class="check"><input type="checkbox" id="setting-priority" checked disabled><span data-text="settings.showPriority"></span></label>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.tagsTitle"></h3>
<p class="hint" id="settings-tags-empty" data-text="settings.tagsEmpty" hidden></p>
<ul class="tag-manage" id="settings-tags"></ul>
<p class="form-error" id="settings-message" role="alert" hidden></p>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.dataTitle"></h3>
<p class="hint" data-text="settings.exportHint"></p>
<button type="button" class="btn btn-secondary btn-small" id="export-data" data-text="settings.export"></button>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.passwordTitle"></h3>
<button type="button" class="btn btn-secondary btn-small" id="password-open" data-text="settings.changePassword"></button>
<form class="form" id="password-form" novalidate hidden>
<label class="field"><span data-text="settings.currentPassword"></span><input id="password-current" type="password" autocomplete="current-password"></label>
<label class="field"><span data-text="settings.newPassword"></span><input id="password-new" type="password" autocomplete="new-password"><small class="hint" data-text="auth.passwordHint"></small></label>
<label class="field"><span data-text="auth.passwordRepeat"></span><input id="password-new2" type="password" autocomplete="new-password"></label>
<p class="form-error" id="password-error" role="alert" hidden></p>
<p class="hint" id="password-done" role="status" hidden></p>
<div class="prompt-actions">
<button type="submit" class="btn btn-primary btn-small" data-text="settings.savePassword"></button>
<button type="button" class="btn btn-secondary btn-small" id="password-cancel" data-text="settings.tagCancel"></button>
</div>
</form>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.languageTitle"></h3>
<select class="cond-select" id="language-select" data-label="lang.label"></select>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.homeScreenTitle"></h3>
<button type="button" class="btn btn-secondary btn-small" id="a2hs-settings" data-text="a2hs.open"></button>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.infoTitle"></h3>
<nav class="legal-links settings-links" data-label="nav.info">
<a href="#/about" data-text="legal.about"></a>
<a href="#/data-privacy" data-text="legal.dataPrivacy"></a>
<a href="#/privacy" data-text="legal.privacy"></a>
<a href="#/impressum" data-text="legal.impressum"></a>
</nav>
</div>

<div class="setting danger">
<button type="button" class="link link-danger" id="delete-open" data-text="settings.deleteAccount"></button>
<dialog class="modal" id="delete-dialog" aria-labelledby="delete-title">
<form class="form" id="delete-form" novalidate>
<h3 class="prompt-title" id="delete-title" data-text="settings.deleteAccount"></h3>
<p data-text="settings.deleteWarning"></p>
<label class="field"><span data-text="settings.deletePassword"></span><input id="delete-password" type="password" autocomplete="current-password"></label>
<p class="form-error" id="delete-error" role="alert" hidden></p>
<div class="prompt-actions">
<button type="submit" class="btn btn-danger btn-small" data-text="settings.deleteConfirm"></button>
<button type="button" class="btn btn-secondary btn-small" id="delete-cancel" data-text="settings.tagCancel"></button>
</div>
</form>
</dialog>
</div>
</section>

<nav class="legal-links app-footer no-print" data-label="nav.info">
<a href="#/about" data-text="legal.about"></a>
<a href="#/data-privacy" data-text="legal.dataPrivacy"></a>
<a href="#/privacy" data-text="legal.privacy"></a>
<a href="#/impressum" data-text="legal.impressum"></a>
</nav>
</main>

<nav class="nav" data-label="nav.main">
<a class="nav-item" href="#/home" data-nav="home">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
<span data-text="nav.home"></span>
</a>
<a class="nav-item" href="#/contacts" data-nav="contacts">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
<span data-text="nav.contacts"></span>
</a>
<a class="nav-item" href="#/upcoming" data-nav="upcoming">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
<span data-text="nav.upcoming"></span>
</a>
<a class="nav-item" href="#/settings" data-nav="settings">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
<span data-text="nav.settings"></span>
</a>
</nav>

</div>
<dialog class="welcome" id="welcome" aria-labelledby="welcome-title">
<img class="welcome-logo" src="icons/logo.svg" alt="" width="72" height="72">
<h2 id="welcome-title" data-text="welcome.title"></h2>
<p class="welcome-lead" data-text="welcome.lead"></p>
<ul class="welcome-list">
<li data-text="welcome.point1"></li>
<li data-text="welcome.point2"></li>
<li data-text="welcome.point3"></li>
</ul>
<button type="button" class="btn btn-primary btn-form" id="welcome-close" data-text="welcome.go"></button>
</dialog>
<div class="auth" id="auth-root">
<div class="auth-box">
<div class="lang-row"><select class="cond-select" id="auth-lang" data-label="lang.label"></select></div>
<div class="brand"><img class="brand-logo" src="icons/logo.svg" alt="" width="52" height="52"><h1 class="wordmark" data-text="app.name"></h1></div>

<section data-auth="signin" hidden>
<h2 class="auth-title" data-text="auth.signInTitle"></h2>
<form class="form" id="signin-form" novalidate>
<label class="field">
<span data-text="auth.username"></span>
<input id="signin-username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
<small class="hint" data-text="auth.usernameHintShort"></small>
</label>
<label class="field">
<span data-text="auth.password"></span>
<input id="signin-password" type="password" autocomplete="current-password">
</label>
<p class="form-error" id="signin-error" role="alert" hidden></p>
<button type="submit" class="btn btn-primary btn-form" data-text="auth.signInButton"></button>
</form>
<p class="auth-switch"><button type="button" class="link" data-auth-go="reset" data-text="auth.forgotLink"></button></p>
<p class="auth-switch"><span data-text="auth.noAccount"></span> <button type="button" class="link" data-auth-go="signup" data-text="auth.createLink"></button></p>
<p class="auth-switch"><button type="button" class="link" id="welcome-open" data-text="welcome.link"></button></p>
</section>

<section data-auth="reset" hidden>
<h2 class="auth-title" data-text="auth.resetTitle"></h2>
<p data-text="auth.resetText"></p>
<form class="form" id="reset-form" novalidate>
<label class="field">
<span data-text="auth.username"></span>
<input id="reset-username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
<small class="hint" data-text="auth.usernameHintShort"></small>
</label>
<label class="field">
<span data-text="auth.resetKey"></span>
<input id="reset-key" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
</label>
<label class="field">
<span data-text="auth.resetNewPassword"></span>
<input id="reset-password" type="password" autocomplete="new-password">
<small class="hint" data-text="auth.passwordHint"></small>
</label>
<label class="field">
<span data-text="auth.passwordRepeat"></span>
<input id="reset-password2" type="password" autocomplete="new-password">
</label>
<p class="form-error" id="reset-error" role="alert" hidden></p>
<button type="submit" class="btn btn-primary btn-form" data-text="auth.resetButton"></button>
</form>
<p class="auth-switch"><button type="button" class="link" data-auth-go="signin" data-text="auth.resetBack"></button></p>
</section>

<section data-auth="signup" hidden>
<h2 class="auth-title" data-text="auth.signUpTitle"></h2>
<form class="form" id="signup-form" novalidate>
<label class="field">
<span data-text="auth.username"></span>
<input id="signup-username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
<small class="hint" data-text="auth.usernameHint"></small>
</label>
<label class="field">
<span data-text="auth.password"></span>
<input id="signup-password" type="password" autocomplete="new-password">
<small class="hint" data-text="auth.passwordHint"></small>
</label>
<label class="field">
<span data-text="auth.passwordRepeat"></span>
<input id="signup-password2" type="password" autocomplete="new-password">
</label>
<p class="hint" data-text="auth.warning"></p>
<p class="hint"><span data-text="auth.agree"></span> <a href="#/privacy" data-text="legal.privacy"></a> <span data-text="auth.agreeAnd"></span> <a href="#/data-privacy" data-text="legal.dataPrivacy"></a>.</p>
<p class="form-error" id="signup-error" role="alert" hidden></p>
<button type="submit" class="btn btn-primary btn-form" data-text="auth.signUpButton"></button>
</form>
<p class="auth-switch"><span data-text="auth.haveAccount"></span> <button type="button" class="link" data-auth-go="signin" data-text="auth.signInLink"></button></p>
</section>

<section data-auth="locked" hidden>
<h2 class="auth-title" id="locked-title"></h2>
<p data-text="auth.lockedText"></p>
<form class="form" id="locked-form" novalidate>
<label class="field">
<span data-text="auth.password"></span>
<input id="locked-password" type="password" autocomplete="current-password">
</label>
<p class="form-error" id="locked-error" role="alert" hidden></p>
<button type="submit" class="btn btn-primary btn-form" data-text="auth.unlockButton"></button>
</form>
<p class="auth-switch"><button type="button" class="link" data-action="sign-out" data-text="auth.otherAccount"></button></p>
</section>

<section data-auth="recovery" hidden>
<h2 class="auth-title" data-text="auth.recoveryTitle"></h2>
<p class="hint" id="recovery-account"></p>
<p data-text="auth.recoveryText"></p>
<p class="recovery-key" id="recovery-key"></p>
<div class="recovery-actions no-print">
<button type="button" class="btn btn-secondary btn-small" id="recovery-download" data-text="auth.recoveryDownload"></button>
<button type="button" class="btn btn-secondary btn-small" id="recovery-copy" data-text="auth.recoveryCopy"></button>
<button type="button" class="btn btn-secondary btn-small" id="recovery-print" data-text="auth.recoveryPrint"></button>
<button type="button" class="btn btn-secondary btn-small" id="recovery-email" data-text="auth.recoveryEmail"></button>
</div>
<p class="hint no-print" data-text="auth.recoveryEmailWarning"></p>
<label class="check no-print">
<input type="checkbox" id="recovery-confirm">
<span data-text="auth.recoveryConfirm"></span>
</label>
<p class="form-error no-print" id="recovery-error" role="alert" hidden></p>
<button type="button" class="btn btn-primary btn-form no-print" id="recovery-finish" disabled data-text="auth.recoveryFinish"></button>
</section>

<nav class="legal-links no-print" data-label="nav.info">
<a href="#/about" data-text="legal.about"></a>
<a href="#/data-privacy" data-text="legal.dataPrivacy"></a>
<a href="#/privacy" data-text="legal.privacy"></a>
<a href="#/impressum" data-text="legal.impressum"></a>
</nav>

</div>
</div>

<div class="pages" id="pages-root" hidden>
<div class="auth-box pages-box">
<a class="link back" id="pages-back" href="#/home" data-text="pages.back"></a>
<article id="page-content"></article>
<nav class="legal-links no-print pages-links" data-label="nav.info">
<a href="#/about" data-text="legal.about"></a>
<a href="#/data-privacy" data-text="legal.dataPrivacy"></a>
<a href="#/privacy" data-text="legal.privacy"></a>
<a href="#/impressum" data-text="legal.impressum"></a>
</nav>
</div>
</div>
<script src="lib/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
