<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF5EC">
<title>Folkhold</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<main class="content">

<section class="screen" data-screen="home" hidden>
<header class="home-header">
<h1 class="wordmark" data-text="app.name"></h1>
</header>

<div class="home-actions">
<button type="button" class="btn btn-primary" data-action="add-contact">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M19 8v6M16 11h6"/></svg>
<span data-text="home.addContact"></span>
</button>
<div class="btn-row">
<button type="button" class="btn btn-secondary" data-action="add-event">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>
<span data-text="home.addEvent"></span>
</button>
<button type="button" class="btn btn-secondary" data-action="add-note">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
<span data-text="home.addNote"></span>
</button>
</div>
</div>

<div class="section-head">
<h2 class="section-title" data-text="home.upcomingTitle"></h2>
<span class="section-note" data-text="home.upcomingRange"></span>
</div>
<p class="empty" data-text="home.upcomingEmpty"></p>
</section>

<section class="screen" data-screen="contacts" hidden>
<h2 class="section-title" data-text="contacts.title"></h2>
<p class="empty" data-text="contacts.empty"></p>
</section>

<section class="screen" data-screen="upcoming" hidden>
<h2 class="section-title" data-text="upcoming.title"></h2>
<p class="empty" data-text="upcoming.empty"></p>
</section>

<section class="screen" data-screen="settings" hidden>
<h2 class="section-title" data-text="settings.title"></h2>
<p class="empty" data-text="settings.empty"></p>
</section>

</main>

<nav class="nav" aria-label="Main">
<a class="nav-item" href="#/home" data-nav="home">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
<span data-text="nav.home"></span>
</a>
<a class="nav-item" href="#/contacts" data-nav="contacts">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
<span data-text="nav.contacts"></span>
</a>
<a class="nav-item" href="#/upcoming" data-nav="upcoming">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
<span data-text="nav.upcoming"></span>
</a>
<a class="nav-item" href="#/settings" data-nav="settings">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
<span data-text="nav.settings"></span>
</a>
</nav>

</div>
<script src="lib/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
