<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF5EC">
<title>Folkhold</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" hidden>

<main class="content">

<section class="screen" data-screen="home" hidden>
<header class="home-header">
<h1 class="wordmark" data-text="app.name"></h1>
</header>

<div class="home-actions">
<button type="button" class="btn btn-primary" data-action="add-contact">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M19 8v6M16 11h6"/></svg>
<span data-text="home.addContact"></span>
</button>
<div class="btn-row">
<button type="button" class="btn btn-secondary" data-action="add-event">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>
<span data-text="home.addEvent"></span>
</button>
<button type="button" class="btn btn-secondary" data-action="add-note">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
<span data-text="home.addNote"></span>
</button>
</div>
</div>

<div class="section-head">
<h2 class="section-title" data-text="home.upcomingTitle"></h2>
<span class="section-note" data-text="home.upcomingRange"></span>
</div>
<p class="empty" data-text="home.upcomingEmpty"></p>
</section>

<section class="screen" data-screen="contacts" hidden>
<div class="screen-head">
<h2 class="section-title" data-text="contacts.title"></h2>
<button type="button" class="btn btn-secondary btn-small" data-action="add-contact" data-text="contacts.add"></button>
</div>
<p class="empty" id="contacts-status" hidden></p>
<ul class="people" id="contacts-list"></ul>
<p class="empty" id="contacts-empty" data-text="contacts.empty" hidden></p>
</section>

<section class="screen" data-screen="contact" hidden>
<a class="link back" href="#/contacts" data-text="contact.back"></a>
<div id="contact-page"></div>
</section>

<section class="screen" data-screen="events" hidden>
<div id="events-page"></div>
</section>

<section class="screen" data-screen="note" hidden>
<div id="note-page"></div>
</section>

<section class="screen" data-screen="upcoming" hidden>
<h2 class="section-title" data-text="upcoming.title"></h2>
<p class="empty" data-text="upcoming.empty"></p>
</section>

<section class="screen" data-screen="settings" hidden>
<h2 class="section-title" data-text="settings.title"></h2>
<div class="account">
<p class="account-line"><span data-text="settings.signedInAs"></span> <strong id="settings-username"></strong></p>
<button type="button" class="btn btn-secondary btn-small" data-action="sign-out" data-text="settings.signOut"></button>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.sortTitle"></h3>
<div class="choice">
<label class="choice-option"><input type="radio" name="contact-sort" value="first" checked disabled><span data-text="settings.sortFirst"></span></label>
<label class="choice-option"><input type="radio" name="contact-sort" value="last" disabled><span data-text="settings.sortLast"></span></label>
</div>
</div>

<div class="setting">
<h3 class="group-title" data-text="settings.contactPageTitle"></h3>
<label class="check"><input type="checkbox" id="setting-lastmet" checked disabled><span data-text="settings.showLastMet"></span></label>
<p class="form-error" id="settings-message" role="alert" hidden></p>
</div>
</section>

</main>

<nav class="nav" aria-label="Main">
<a class="nav-item" href="#/home" data-nav="home">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
<span data-text="nav.home"></span>
</a>
<a class="nav-item" href="#/contacts" data-nav="contacts">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
<span data-text="nav.contacts"></span>
</a>
<a class="nav-item" href="#/upcoming" data-nav="upcoming">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
<span data-text="nav.upcoming"></span>
</a>
<a class="nav-item" href="#/settings" data-nav="settings">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
<span data-text="nav.settings"></span>
</a>
</nav>

</div>
<div class="auth" id="auth-root">
<div class="auth-box">
<h1 class="wordmark" data-text="app.name"></h1>

<section data-auth="signin" hidden>
<h2 class="auth-title" data-text="auth.signInTitle"></h2>
<form class="form" id="signin-form" novalidate>
<label class="field">
<span data-text="auth.username"></span>
<input id="signin-username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
</label>
<label class="field">
<span data-text="auth.password"></span>
<input id="signin-password" type="password" autocomplete="current-password">
</label>
<p class="form-error" id="signin-error" role="alert" hidden></p>
<button type="submit" class="btn btn-primary btn-form" data-text="auth.signInButton"></button>
</form>
<p class="auth-switch"><span data-text="auth.noAccount"></span> <button type="button" class="link" data-auth-go="signup" data-text="auth.createLink"></button></p>
</section>

<section data-auth="signup" hidden>
<h2 class="auth-title" data-text="auth.signUpTitle"></h2>
<form class="form" id="signup-form" novalidate>
<label class="field">
<span data-text="auth.username"></span>
<input id="signup-username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
<small class="hint" data-text="auth.usernameHint"></small>
</label>
<label class="field">
<span data-text="auth.password"></span>
<input id="signup-password" type="password" autocomplete="new-password">
<small class="hint" data-text="auth.passwordHint"></small>
</label>
<label class="field">
<span data-text="auth.passwordRepeat"></span>
<input id="signup-password2" type="password" autocomplete="new-password">
</label>
<p class="hint" data-text="auth.warning"></p>
<p class="form-error" id="signup-error" role="alert" hidden></p>
<button type="submit" class="btn btn-primary btn-form" data-text="auth.signUpButton"></button>
</form>
<p class="auth-switch"><span data-text="auth.haveAccount"></span> <button type="button" class="link" data-auth-go="signin" data-text="auth.signInLink"></button></p>
</section>

<section data-auth="locked" hidden>
<h2 class="auth-title" id="locked-title"></h2>
<p data-text="auth.lockedText"></p>
<form class="form" id="locked-form" novalidate>
<label class="field">
<span data-text="auth.password"></span>
<input id="locked-password" type="password" autocomplete="current-password">
</label>
<p class="form-error" id="locked-error" role="alert" hidden></p>
<button type="submit" class="btn btn-primary btn-form" data-text="auth.unlockButton"></button>
</form>
<p class="auth-switch"><button type="button" class="link" data-action="sign-out" data-text="auth.otherAccount"></button></p>
</section>

<section data-auth="recovery" hidden>
<h2 class="auth-title" data-text="auth.recoveryTitle"></h2>
<p class="hint" id="recovery-account"></p>
<p data-text="auth.recoveryText"></p>
<p class="recovery-key" id="recovery-key"></p>
<div class="recovery-actions no-print">
<button type="button" class="btn btn-secondary btn-small" id="recovery-download" data-text="auth.recoveryDownload"></button>
<button type="button" class="btn btn-secondary btn-small" id="recovery-copy" data-text="auth.recoveryCopy"></button>
<button type="button" class="btn btn-secondary btn-small" id="recovery-print" data-text="auth.recoveryPrint"></button>
<button type="button" class="btn btn-secondary btn-small" id="recovery-email" data-text="auth.recoveryEmail"></button>
</div>
<p class="hint no-print" data-text="auth.recoveryEmailWarning"></p>
<label class="check no-print">
<input type="checkbox" id="recovery-confirm">
<span data-text="auth.recoveryConfirm"></span>
</label>
<p class="form-error no-print" id="recovery-error" role="alert" hidden></p>
<button type="button" class="btn btn-primary btn-form no-print" id="recovery-finish" disabled data-text="auth.recoveryFinish"></button>
</section>

</div>
</div>
<script src="lib/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
